name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy EmailJS credentials for build/e2e - tests mock the network, so no
  # real secrets are ever required (or present) in CI. Real credentials are
  # scoped to deployment environments only; see SECURITY.md.
  VITE_EMAILJS_SERVICE_ID: service_dummy_ci
  VITE_EMAILJS_TEMPLATE_ID: template_dummy_ci
  VITE_EMAILJS_PUBLIC_KEY: dummy_public_key_ci

jobs:
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (includes typecheck)
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client/dist
          retention-days: 3

  e2e:
    name: E2E (UI + API) with published results
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: client/dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        id: test-step
        run: npx playwright test
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
          CI: 'true'

      - name: Save run metadata
        if: always()
        run: |
          RUN_DIR="Results/Run-${{ github.run_number }}"
          mkdir -p "$RUN_DIR"

          # Copy Playwright HTML and JSON reports
          cp -r playwright-report/* "$RUN_DIR/" || true

          date '+%d-%m-%Y %I:%M%p' > "$RUN_DIR/timestamp.txt"
          # Shown on the report page's run cards; short SHA links to the commit.
          echo "${{ github.ref_name }}" > "$RUN_DIR/branch.txt"
          echo "${{ github.sha }}" > "$RUN_DIR/commit.txt"
          if [ "${{ steps.test-step.outcome }}" == "success" ]; then
            echo "passed" > "$RUN_DIR/status.txt"
          else
            echo "failed" > "$RUN_DIR/status.txt"
          fi

      - name: Download previous reports
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: old-reports
        continue-on-error: true

      - name: Prepare results with history
        if: always()
        # The page generator lives in a checked-in script: GitHub caps run
        # blocks at ~21000 chars and the full generator outgrew that (the
        # parser reports it as "Exceeded max expression length 21000").
        # GITHUB_RUN_NUMBER and GITHUB_REPOSITORY come from the runner env.
        run: bash .github/scripts/generate-report-page.sh

      - name: Save results history to branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Results
          publish_branch: gh-pages
          force_orphan: false

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Results

  deploy:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
