name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI needs no mail credentials: the e2e suite intercepts the browser call to
  # /api/contact, so the server route never runs and no mail leaves the runner.
  # Real credentials are scoped to deployment environments only; see docs/SECURITY.md.
  # Better Auth refuses to boot in production without a secret. This is a
  # throwaway CI value, never a deployment credential.
  BETTER_AUTH_SECRET: ci_only_not_a_real_secret_0123456789abcdef

jobs:
  quality:
    name: Lint · Typecheck · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (includes typecheck)
        run: npm run build

  e2e:
    name: E2E (UI + API) with published results
    needs: [quality]
    # Run even when quality failed: a skipped e2e job means that run number
    # never reaches the report page (Run-73 disappeared when unit tests
    # failed). Only a cancelled run has nothing worth publishing.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    # A throwaway Mongo for the auth e2e tests: the MongoDB adapter needs a
    # live database to validate sessions, and a service container keeps CI
    # free of any real credential (see docs/SECURITY.md).
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/makeyev_e2e
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keep the browser binaries between runs: a cache hit still runs the apt
      # dependency install, but skips the large CDN download that failed
      # transiently in run #135.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # The browser download and the apt dependency install both hit external
      # mirrors, and either can fail transiently (run #135 failed here and the
      # test step was skipped, so the report had no results at all). Retry the
      # whole install a few times before giving up.
      - name: Install Playwright browsers
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::Playwright browser install failed (attempt $attempt of 3); retrying in 15s."
            sleep 15
          done
          echo "::error::Playwright browsers could not be installed after 3 attempts."
          exit 1

      # One config, one app: the webServer builds and boots the production
      # Next server (see playwright.config.ts). No separate legacy suite.
      - name: Run Playwright tests
        id: test-step
        run: npx playwright test
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/results.json
          CI: 'true'

      - name: Save run metadata
        if: always()
        run: |
          RUN_DIR="Results/Run-${{ github.run_number }}"
          mkdir -p "$RUN_DIR"

          # Copy Playwright HTML and JSON reports
          cp -r playwright-report/* "$RUN_DIR/" || true

          date '+%d-%m-%Y %I:%M%p' > "$RUN_DIR/timestamp.txt"
          # Shown on the report page's run cards; short SHA links to the commit.
          echo "${{ github.ref_name }}" > "$RUN_DIR/branch.txt"
          echo "${{ github.sha }}" > "$RUN_DIR/commit.txt"
          if [ "${{ steps.test-step.outcome }}" == "success" ]; then
            echo "passed" > "$RUN_DIR/status.txt"
          else
            echo "failed" > "$RUN_DIR/status.txt"
          fi

      - name: Download previous reports
        # always(): the steps that push to gh-pages run even after a hard
        # failure, and without the old reports they would publish a tree
        # holding only this run - wiping the report page's history.
        if: always()
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: old-reports
        continue-on-error: true

      - name: Prepare results with history
        if: always()
        # The page generator lives in a checked-in script: GitHub caps run
        # blocks at ~21000 chars and the full generator outgrew that (the
        # parser reports it as "Exceeded max expression length 21000").
        # GITHUB_RUN_NUMBER and GITHUB_REPOSITORY come from the runner env.
        run: bash .github/scripts/generate-report-page.sh

      - name: Save results history to branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Results
          publish_branch: gh-pages
          force_orphan: false

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Results

      # Last step on purpose: the report above must be published before the
      # run is marked red, so the test step is allowed to fail itself
      # (continue-on-error) and this step fails the job from its outcome.
      # Without it the workflow reported success for runs 75-81 while every
      # one of them had failing tests.
      - name: Fail the run when tests failed
        if: always() && steps.test-step.outcome != 'success'
        run: |
          outcome="${{ steps.test-step.outcome }}"
          if [ "$outcome" = "skipped" ]; then
            # 'skipped' means an earlier step failed (usually the browser
            # install), not that the tests failed. Point at the real cause
            # instead of reporting a Playwright outcome that never happened.
            echo "::error::Playwright never ran: an earlier step failed. Fix the first failing step above; this report has no test results."
          else
            echo "::error::Playwright outcome was '$outcome'. Report published; failing the run."
          fi
          exit 1

  deploy:
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github_pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
