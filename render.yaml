services:
  # The one app: Next.js (App Router) at the repo root. The market-data API is
  # a Next route handler now (src/server/market), so there is no separate
  # backend service. The client vars use their clean (non-prefixed) names:
  # next.config.ts inlines them into the browser bundle, and
  # src/config/env.ts validates them (NEXT_PUBLIC_* is also accepted).
  - type: web
    name: makeyev-finance
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      # Server-only secret (the market API). Set in the Render dashboard.
      - key: FINNHUB_API_KEY
        sync: false
      # --- Auth (Better Auth + MongoDB), all server-only ------------------
      # Generated by Render once. Rotating it invalidates every session.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Mongo connection string, database name included. Set in the dashboard.
      - key: MONGODB_URI
        sync: false
      # Mail (Resend), all server-only. Render only prompts for `sync: false`
      # values when the Blueprint is first created, so type these into the
      # dashboard by hand afterwards.
      - key: RESEND_API_KEY
        sync: false
      # From address for every outgoing mail: MUST be on a domain verified at
      # https://resend.com/domains. A consumer domain (gmail.com, ...) can never
      # be verified, and every send from one is rejected (validation_error, 403);
      # leaving this empty falls back to Resend's test sender, which delivers
      # only to the Resend account owner. `npm run mail:doctor` checks it.
      - key: AUTH_EMAIL_FROM
        sync: false
      # Where contact-form submissions go (defaults to the site's own inbox).
      - key: CONTACT_TO_EMAIL
        sync: false
      # Optional override. The public origin is compiled in (see DEPLOY_ORIGINS
      # in src/server/auth/config.ts), so a deploy needs no value; set this only
      # for an origin that list does not name (e.g. a preview deploy).
      - key: BETTER_AUTH_URL
        sync: false
