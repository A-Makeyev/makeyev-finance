services:
  # The one app: Next.js (App Router) at the repo root. The market-data API is
  # a Next route handler now (src/server/market), so there is no separate
  # backend service. The client vars use their clean (non-prefixed) names:
  # next.config.ts inlines them into the browser bundle, and
  # src/config/env.ts validates them (NEXT_PUBLIC_* is also accepted).
  - type: web
    name: makeyev-finance
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      # Public-by-design (baked into the client bundle); same values as .env.example.
      - key: EMAILJS_SERVICE_ID
        value: service_k2c0eve
      - key: EMAILJS_TEMPLATE_ID
        value: template_kmxsnuc
      - key: EMAILJS_PUBLIC_KEY
        value: 2y064p5z9qRvVxOHN
      # Server-only secret (the market API). Set in the Render dashboard.
      - key: FINNHUB_API_KEY
        sync: false
      # --- Auth (Better Auth + MongoDB), all server-only ------------------
      # Generated by Render once. Rotating it invalidates every session.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Mongo connection string, database name included. Set in the dashboard.
      - key: MONGODB_URI
        sync: false
      # Resend API key + the From address for verification emails.
      - key: RESEND_API_KEY
        sync: false
      - key: AUTH_EMAIL_FROM
        sync: false
      # This deployment's public origin (e.g. the onrender.com URL). Its host
      # joins the redirect allowlist and it is the fallback origin. Required on
      # deploys; local dev needs no value.
      - key: BETTER_AUTH_URL
        sync: false
